name: Build fighters

# One job per fighter: Blender 4.5 + MPFB build the body, gear, mask and shards (pipeline/blender/fighter.py),
# post.mjs compresses and checks the result, and the review renders go up as artifacts (collected into one
# `previews` artifact). With publish, the pack is assembled and released (pipeline/publish.mjs).
# Every input comes from release inputs-v1 (vendor.yml).
on:
  workflow_dispatch:
    inputs:
      fighters:
        description: Fighter ids, comma or space separated, or "all"
        default: reiji
      publish:
        description: Publish the pack release
        type: boolean
        default: false
      fast:
        description: Lighter bakes (iteration only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      list: ${{ steps.p.outputs.list }}
    steps:
      - id: p
        env:
          IN: ${{ inputs.fighters }}
        run: |
          if [ "$IN" = all ]; then IN="reiji mara elyema bia duke sorn han gu"; fi
          list=$(echo "$IN" | tr ', ' '\n\n' | grep -v '^$' | jq -R . | jq -sc .)
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fighter: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache/restore@v4
        id: env
        with:
          path: |
            ~/blender
            ~/.config/blender
            ~/ktx
          key: env-v1-${{ hashFiles('pipeline/inputs.json', 'pipeline/setup.sh', 'pipeline/blender/extract_packs.py', 'pipeline/blender/mp.py') }}
      - name: Blender, MPFB, Cell Fracture, the packs, KTX-Software
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash pipeline/setup.sh
      - uses: actions/cache/save@v4
        if: steps.env.outputs.cache-hit != 'true'
        with:
          path: |
            ~/blender
            ~/.config/blender
            ~/ktx
          key: ${{ steps.env.outputs.cache-primary-key }}
      - name: gltf-transform
        run: npm install --no-audit --no-fund --prefix pipeline
      - name: Build ${{ matrix.fighter }}
        run: ~/blender/blender -b --python-exit-code 1 -P pipeline/blender/fighter.py -- ${{ matrix.fighter }} work/${{ matrix.fighter }} ${{ inputs.fast && '--fast' || '' }}
      - name: Compress and check
        run: node pipeline/post.mjs work/${{ matrix.fighter }} ${{ matrix.fighter }}
      - name: Report
        if: always()
        run: |
          cp work/${{ matrix.fighter }}/*.stats.json work/${{ matrix.fighter }}/previews/ 2>/dev/null || true
          cp work/${{ matrix.fighter }}/dist/fighters/${{ matrix.fighter }}.json work/${{ matrix.fighter }}/previews/${{ matrix.fighter }}.meta.json 2>/dev/null || true
          ls -la work/${{ matrix.fighter }}/dist/fighters work/${{ matrix.fighter }}/tex 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: previews-${{ matrix.fighter }}
          path: work/${{ matrix.fighter }}/previews/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: fighter-${{ matrix.fighter }}
          path: work/${{ matrix.fighter }}/dist/

  collect:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: previews
          pattern: previews-*
          delete-merged: false

  publish:
    needs: build
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: fighter-*
          path: pack
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: previews-*
          path: previews
          merge-multiple: true
      - name: The common set (three r186's Basis transcoder, for KTX2Loader)
        run: |
          mkdir -p pack/common /tmp/three
          cd /tmp/three
          for i in 1 2 3 4 5; do npm pack three@0.186.0 --silent && break; sleep $((i * 5)); done
          tar -xzf three-0.186.0.tgz package/examples/jsm/libs/basis
          cp package/examples/jsm/libs/basis/basis_transcoder.js package/examples/jsm/libs/basis/basis_transcoder.wasm "$GITHUB_WORKSPACE/pack/common/"
      - id: p
        name: Manifest, tarball, parts
        run: node pipeline/publish.mjs --in pack --rel rel --previews previews
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACK: ${{ steps.p.outputs.pack }}
        run: |
          {
            echo "Mortal Eggy asset pack $PACK, built by run ${{ github.run_id }} from ${{ github.sha }}."
            echo
            echo "- \`mortal-$PACK.tar.NN\`: the shipped tree in 10 MiB parts (\`parts.json\` lists them with sha256)."
            echo "- \`manifest.json\`: every shipped file with size, sha256 and set. Layout and node names: PACK.md."
            echo "- Every shipped file on its own (\`fighters-<id>.glb\` …) and the review renders (\`preview-*.png\`, not shipped)."
          } > notes.md
          cd rel
          if gh release view "$PACK" >/dev/null 2>&1; then
            gh release upload "$PACK" * --clobber
          else
            gh release create "$PACK" * --title "$PACK" --notes-file ../notes.md
          fi
          echo "Published $PACK" >> "$GITHUB_STEP_SUMMARY"
